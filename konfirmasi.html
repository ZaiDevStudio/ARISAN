<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Konfirmasi Admin - Arisan Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        html, body { height: 100%; overflow-x: hidden; overflow-y: auto; scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 160px; color: #334155; }

        /* Header Luxe */
        .main-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
            padding: 50px 25px 80px 25px;
            border-radius: 0 0 50px 50px;
            color: white;
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.15);
        }

        /* Card Laporan */
        .confirm-card {
            background: white; border-radius: 35px; padding: 25px;
            border: 1px solid #f1f5f9; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: 0.3s ease;
        }

        /* Tombol Aksi */
        .btn-approve {
            background: #4f46e5; color: white; border: none;
            padding: 16px; border-radius: 20px; font-weight: 800;
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            flex: 2; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
        }
        .btn-reject {
            background: #f8fafc; color: #94a3b8; border: 1px solid #f1f5f9;
            padding: 16px; border-radius: 20px; font-weight: 800;
            font-size: 11px; text-transform: uppercase; flex: 1;
        }
        .btn-approve:active, .btn-reject:active { transform: scale(0.96); }

        /* Nav Bawah */
        .nav-bar {
            position: fixed; bottom: 25px; left: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            height: 75px; border-radius: 30px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12); z-index: 9999;
        }
        .nav-item { text-decoration: none; color: #94a3b8; text-align: center; font-size: 8px; font-weight: 800; }
        .nav-item.active { color: #4f46e5; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="main-header">
        <div class="flex justify-between items-center mb-5">
            <a href="dashboard.html" class="w-11 h-11 bg-white/10 rounded-2xl flex items-center justify-center text-white"><i class="fa-solid fa-chevron-left"></i></a>
            <h2 class="font-black text-lg uppercase tracking-tight">Validasi Bayar</h2>
            <div class="w-11 h-11 bg-white/10 rounded-2xl flex items-center justify-center text-indigo-200">
                <i class="fa-solid fa-bell"></i>
            </div>
        </div>
        <div class="text-center">
            <span class="bg-white/10 px-4 py-2 rounded-full text-[10px] font-bold tracking-[2px] border border-white/10 uppercase">Approval Panel</span>
        </div>
    </div>

    <div class="p-6 -mt-10" id="listLaporan">
        <div class="text-center py-20 bg-white rounded-[35px] shadow-xl shadow-indigo-100/20">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-4"></i>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Memeriksa Laporan...</p>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i>HOME</a>
        <a href="bayar.html" class="nav-item"><i class="fa-solid fa-wallet"></i>BAYAR</a>
        <a href="antrian.html" class="nav-item"><i class="fa-solid fa-list-ol"></i>ANTRIAN</a>
        <a href="pemenang.html" class="nav-item"><i class="fa-solid fa-crown"></i>WINNER</a>
    </nav>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuAkqz-1dDcBhL5iYppX25pM5sF7LX8CQ",
            authDomain: "arisan-17397.firebaseapp.com",
            projectId: "arisan-17397",
            storageBucket: "arisan-17397.firebasestorage.app",
            messagingSenderId: "12736886742",
            appId: "1:12736886742:web:b6da8d1bd74ea5ae839677"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const q = query(collection(db, "anggota"), where("statusKonfirmasi", "==", "tunggu"));

        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('listLaporan');
            container.innerHTML = "";

            if(snapshot.empty) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 35px; border: 2px dashed #f1f5f9;">
                        <i class="fa-solid fa-face-smile-beam" style="font-size: 40px; color: #e2e8f0; margin-bottom: 15px;"></i>
                        <p style="color: #94a3b8; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Semua laporan sudah divalidasi!</p>
                    </div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const sudahBayar = data.dibayar || 0;

                container.innerHTML += `
                    <div class="confirm-card">
                        <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 25px;">
                            <div style="width: 55px; height: 55px; background: #eef2ff; color: #4f46e5; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                                <i class="fa-solid fa-file-invoice-dollar"></i>
                            </div>
                            <div>
                                <h3 style="font-weight: 900; color: #1e293b; font-size: 15px; text-transform: uppercase;">${data.nama}</h3>
                                <p style="font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-top: 2px;">Progres: ${sudahBayar}/13 Periode</p>
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 12px;">
                            <button onclick="prosesKonfirmasi('${id}', 'setuju')" class="btn-approve">Setujui</button>
                            <button onclick="prosesKonfirmasi('${id}', 'tolak')" class="btn-reject">Tolak</button>
                        </div>
                    </div>`;
            });
        });

        window.prosesKonfirmasi = async (id, aksi) => {
            const memberRef = doc(db, "anggota", id);
            try {
                if (aksi === 'setuju') {
                    const snap = await getDoc(memberRef);
                    const currentData = snap.data();
                    const nextBayar = (currentData.dibayar || 0) + 1;

                    await updateDoc(memberRef, {
                        dibayar: nextBayar,
                        statusBayar: true,
                        statusKonfirmasi: "selesai"
                    });
                    alert(`Pembayaran ${currentData.nama} diterima!`);
                } else {
                    await updateDoc(memberRef, { statusKonfirmasi: "ditolak" });
                    alert("Laporan ditolak.");
                }
            } catch (error) {
                alert("Gagal memproses data.");
            }
        };
    </script>
</body>
</html>
