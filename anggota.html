<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anggota - Arisan Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 160px; }
        .main-header { background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%); padding: 50px 25px 80px 25px; border-radius: 0 0 50px 50px; color: white; box-shadow: 0 15px 35px rgba(79, 70, 229, 0.15); }
        .search-wrapper { background: white; margin: -35px 25px 0 25px; padding: 12px 20px; border-radius: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.05); display: flex; align-items: center; border: 1px solid #eee; }
        .search-wrapper input { border: none; outline: none; width: 100%; font-size: 14px; font-weight: 600; margin-left: 10px; }
        .member-card { background: white; border-radius: 30px; padding: 20px; margin: 15px 25px; border: 1px solid #f1f5f9; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .profile-img { width: 55px; height: 55px; border-radius: 18px; object-fit: cover; background: #eef2ff; }
        .badge { font-size: 9px; font-weight: 900; padding: 5px 12px; border-radius: 10px; text-transform: uppercase; }
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); height: 75px; border-radius: 30px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 999; }
        .nav-item { text-decoration: none; color: #94a3b8; text-align: center; font-size: 8px; font-weight: 800; }
        .nav-item.active { color: #4f46e5; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="main-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="dashboard.html" style="color: white; font-size: 20px;"><i class="fa-solid fa-chevron-left"></i></a>
            <h2 style="font-weight: 900; letter-spacing: 1px;">ANGGOTA</h2>
            <div style="width: 20px;"></div>
        </div>
        <div style="text-align: center; margin-top: 15px;">
            <span style="font-size: 11px; opacity: 0.8; font-weight: 700;">TOTAL: <span id="count">0</span> PESERTA</span>
        </div>
    </div>

    <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass" style="color: #4f46e5;"></i>
        <input type="text" id="searchInput" placeholder="Cari nama..." onkeyup="filterList()">
    </div>

    <div id="memberContainer">
        <div id="loader" style="text-align: center; padding: 100px 0;">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 30px; color: #4f46e5;"></i>
            <p id="loaderText" style="font-size: 10px; font-weight: 800; color: #94a3b8; margin-top: 15px; text-transform: uppercase;">Menghubungkan ke Server...</p>
        </div>
    </div>

    <div class="nav-bar">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i>HOME</a>
        <a href="bayar.html" class="nav-item"><i class="fa-solid fa-wallet"></i>BAYAR</a>
        <a href="anggota.html" class="nav-item active"><i class="fa-solid fa-users"></i>ANGGOTA</a>
        <a href="setting.html" class="nav-item"><i class="fa-solid fa-gear"></i>ADMIN</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuAkqz-1dDcBhL5iYppX25pM5sF7LX8CQ",
            authDomain: "arisan-17397.firebaseapp.com",
            projectId: "arisan-17397",
            storageBucket: "arisan-17397.firebasestorage.app",
            messagingSenderId: "12736886742",
            appId: "1:12736886742:web:b6da8d1bd74ea5ae839677"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const container = document.getElementById('memberContainer');

        // Timeout Fallback (Jika 5 detik gagal load)
        const loadTimeout = setTimeout(() => {
            if(document.getElementById('loader')) {
                document.getElementById('loaderText').innerText = "Koneksi Lemah, Coba Refresh Halaman";
                document.getElementById('loaderText').style.color = "#e11d48";
            }
        }, 8000);

        onSnapshot(query(collection(db, "anggota"), orderBy("nama", "asc")), (snapshot) => {
            clearTimeout(loadTimeout);
            document.getElementById('count').innerText = snapshot.size;
            container.innerHTML = "";
            
            if (snapshot.empty) {
                container.innerHTML = `<p style="text-align: center; padding: 50px; color: #94a3b8; font-weight: 800; font-size: 11px;">BELUM ADA ANGGOTA</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const photoUI = data.foto ? `<img src="${data.foto}" class="profile-img">` : `<div class="profile-img" style="display:flex; align-items:center; justify-content:center; font-weight:800; color:#4f46e5; font-size:20px;">${data.nama.charAt(0).toUpperCase()}</div>`;

                container.innerHTML += `
                    <div class="member-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <div style="display: flex; gap: 15px; align-items: center;">
                                ${photoUI}
                                <div>
                                    <h4 style="font-weight: 800; font-size: 14px; margin:0; text-transform: capitalize;">${data.nama}</h4>
                                    <p style="font-size: 10px; color: #10b981; font-weight: 700; margin-top: 2px;"><i class="fa-brands fa-whatsapp"></i> ${data.whatsapp}</p>
                                </div>
                            </div>
                            <span class="badge" style="background:${data.statusBayar ? '#ecfdf5' : '#fff1f2'}; color:${data.statusBayar ? '#059669' : '#e11d48'};">
                                ${data.statusBayar ? 'Lunas' : 'Belum'}
                            </span>
                        </div>
                        <div style="background: #f8fafc; padding: 12px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #f1f5f9;">
                            <p style="font-size: 11px; font-weight: 600; color: #64748b; margin: 0;">${data.alamat || 'Alamat tidak diisi'}</p>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <a href="tambah_anggota.html?id=${id}" style="flex:1; background:#4f46e5; color:white; text-align:center; padding:12px; border-radius:15px; font-size:10px; font-weight:800; text-decoration:none;">EDIT</a>
                            <button onclick="hapusAnggota('${id}', '${data.nama}')" style="flex:1; background:#fff1f2; color:#e11d48; padding:12px; border-radius:15px; font-size:10px; font-weight:800; border:none;">HAPUS</button>
                        </div>
                    </div>`;
            });
        }, (error) => {
            console.error(error);
            container.innerHTML = `<p style="text-align: center; color: red;">Error: ${error.message}</p>`;
        });

        window.hapusAnggota = async (id, nama) => {
            if(confirm(`Hapus ${nama}?`)) await deleteDoc(doc(db, "anggota", id));
        };

        window.filterList = () => {
            let input = document.getElementById('searchInput').value.toLowerCase();
            Array.from(document.getElementsByClassName('member-card')).forEach(card => {
                card.style.display = card.querySelector('h4').innerText.toLowerCase().includes(input) ? "" : "none";
            });
        };
    </script>
</body>
</html>
