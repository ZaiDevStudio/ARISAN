<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antrian - Arisan Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        html, body { height: 100%; overflow-x: hidden; overflow-y: auto; scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 160px; color: #334155; }

        /* Header Luxe */
        .main-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
            padding: 50px 25px 80px 25px;
            border-radius: 0 0 50px 50px;
            color: white;
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.15);
        }

        /* Stat Badge Floating */
        .floating-count {
            background: white;
            margin: -30px 40px 0 40px;
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #f1f5f9;
        }

        /* Queue Card Premium */
        .queue-card { 
            background: white; border-radius: 30px; padding: 20px; 
            margin-bottom: 15px; border: 1px solid #f1f5f9;
            display: flex; align-items: center; gap: 18px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.02);
            transition: 0.3s;
        }
        .queue-card:active { transform: scale(0.97); }

        .number-box {
            width: 50px; height: 50px; 
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            color: #4f46e5; border-radius: 18px; 
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.8);
        }

        .btn-koreksi {
            width: 45px; height: 45px;
            background: #fff1f2; color: #e11d48;
            border-radius: 15px; display: flex; align-items: center;
            justify-content: center; border: none; transition: 0.3s;
        }
        .btn-koreksi:active { background: #ffe4e6; color: #be123c; }

        /* Nav Bar */
        .nav-bar {
            position: fixed; bottom: 25px; left: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            height: 75px; border-radius: 30px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12); z-index: 9999;
        }
        .nav-item { text-decoration: none; color: #94a3b8; text-align: center; font-size: 8px; font-weight: 800; }
        .nav-item.active { color: #4f46e5; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="main-header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <a href="dashboard.html" style="width: 45px; height: 45px; background: rgba(255,255,255,0.15); border-radius: 18px; display: flex; align-items: center; justify-content: center; color: white;">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h2 style="font-weight: 900; font-size: 18px; letter-spacing: -0.5px; text-transform: uppercase;">ANTRIAN UNDIAN</h2>
            <div style="width: 45px;"></div>
        </div>
        <p style="text-align: center; font-size: 10px; font-weight: 700; opacity: 0.6; letter-spacing: 2px; text-transform: uppercase;">Peserta yang sudah membayar</p>
    </div>

    <div class="floating-count">
        <div style="width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite;"></div>
        <span style="font-size: 12px; font-weight: 900; color: #1e293b; text-transform: uppercase; letter-spacing: 1px;">
            Total: <span id="count-badge">0 Orang</span>
        </span>
    </div>

    <div class="p-6 mt-4">
        <div id="listAntrian">
            <div style="text-align: center; padding: 60px 0;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 30px; color: #4f46e5;"></i>
                <p style="font-size: 10px; font-weight: 800; color: #94a3b8; margin-top: 15px; text-transform: uppercase;">Sinkronisasi Server...</p>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i>HOME</a>
        <a href="antrian.html" class="nav-item active"><i class="fa-solid fa-list-ol"></i>ANTRIAN</a>
        <a href="live.html" class="nav-item"><i class="fa-solid fa-tower-broadcast"></i>LIVE</a>
        <a href="pemenang.html" class="nav-item"><i class="fa-solid fa-crown"></i>WINNER</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuAkqz-1dDcBhL5iYppX25pM5sF7LX8CQ",
            authDomain: "arisan-17397.firebaseapp.com",
            projectId: "arisan-17397",
            storageBucket: "arisan-17397.firebasestorage.app",
            messagingSenderId: "12736886742",
            appId: "1:12736886742:web:b6da8d1bd74ea5ae839677"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const q = query(
            collection(db, "anggota"), 
            where("statusBayar", "==", true), 
            where("sudahMenang", "==", false)
        );
        
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('listAntrian');
            const countBadge = document.getElementById('count-badge');
            container.innerHTML = "";
            
            countBadge.innerText = `${snapshot.size} Peserta`;

            if (snapshot.empty) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 35px; border: 2px dashed #f1f5f9;">
                        <i class="fa-solid fa-folder-open" style="font-size: 40px; color: #e2e8f0; margin-bottom: 15px;"></i>
                        <p style="color: #94a3b8; font-weight: 800; font-size: 11px; text-transform: uppercase;">Belum ada antrian yang siap diundi</p>
                    </div>`;
                return;
            }

            let i = 1;
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                container.innerHTML += `
                    <div class="queue-card">
                        <div class="number-box">${i++}</div>
                        <div style="flex: 1;">
                            <h4 style="font-weight: 800; color: #1e293b; font-size: 14px; margin-bottom: 4px; text-transform: uppercase;">${data.nama}</h4>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <span style="width: 6px; height: 6px; background: #10b981; border-radius: 50%;"></span>
                                <p style="font-size: 9px; text-emerald-600 font-black uppercase tracking-widest; color: #059669; font-weight: 800;">Siap Diundi</p>
                            </div>
                        </div>
                        
                        <button onclick="batalkanAntrian('${id}', '${data.nama}')" class="btn-koreksi">
                            <i class="fa-solid fa-user-minus"></i>
                        </button>
                    </div>`;
            });
        });

        window.batalkanAntrian = async (id, nama) => {
            const yakin = confirm(`Batalkan status "Siap Undi" untuk ${nama}?`);
            if (yakin) {
                try {
                    const ref = doc(db, "anggota", id);
                    await updateDoc(ref, {
                        statusBayar: false
                    });
                } catch (e) {
                    alert("Gagal: " + e.message);
                }
            }
        };
    </script>
    <style>
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</body>
</html>
