<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Draw - Arisan Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --accent: #10b981; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; padding-bottom: 120px; }
        
        .admin-header { 
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%); 
            padding: 50px 25px 80px 25px; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; 
        }

        .control-card { 
            background: white; border-radius: 35px; padding: 35px 25px; 
            margin: -50px 20px 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); 
            border: 1px solid #f1f5f9; text-align: center;
        }

        .btn-start { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: white; border-radius: 22px; padding: 20px; font-weight: 800;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); transition: 0.3s;
        }
        .btn-start:active { transform: scale(0.95); }

        .timer-glow {
            font-size: 50px; font-weight: 900; color: var(--primary);
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.2); font-variant-numeric: tabular-nums;
        }

        .status-pill {
            padding: 6px 16px; border-radius: 100px; font-size: 10px; font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase; display: inline-block; margin-bottom: 20px;
        }

        /* Nav Bar Luxe */
        .nav-bar {
            position: fixed; bottom: 25px; left: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            height: 75px; border-radius: 30px; display: flex; justify-content: space-around;
            align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.12); z-index: 9999;
        }
        .nav-item { text-decoration: none; color: #94a3b8; text-align: center; font-size: 8px; font-weight: 800; flex: 1; }
        .nav-item.active { color: #4f46e5; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="admin-header text-white">
        <div class="flex justify-between items-center mb-4">
            <a href="dashboard.html" class="w-11 h-11 bg-white/10 rounded-2xl flex items-center justify-center text-white"><i class="fa-solid fa-chevron-left"></i></a>
            <h2 class="font-black text-lg uppercase tracking-tight">Drawing Center</h2>
            <div class="w-11"></div>
        </div>
        <div class="text-center">
            <span class="bg-white/10 px-4 py-2 rounded-full text-[10px] font-bold tracking-[2px] border border-white/10 uppercase">Admin Command</span>
        </div>
    </div>

    <div class="control-card">
        <div id="status-label" class="status-pill bg-slate-100 text-slate-500">System Ready</div>
        
        <div id="timer-display" class="timer-glow hidden">01:00</div>

        <p class="text-slate-400 text-[9px] font-bold uppercase tracking-[4px] mb-2">Potential Winner</p>
        <div id="winner-box" class="text-3xl font-black text-slate-800 mb-8 uppercase tracking-tighter">---</div>

        <div class="flex flex-col gap-3">
            <button id="btnStart" class="btn-start text-xs tracking-[2px] uppercase">
                <i class="fa-solid fa-tower-broadcast mr-2"></i> Broadcast Live Draw
            </button>

            <button id="btnReset" class="hidden w-full py-4 text-rose-500 font-bold text-[10px] uppercase tracking-widest bg-rose-50 rounded-2xl">
                Reset System
            </button>
        </div>
    </div>

    <div class="px-8 mt-4">
        <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-[3px] mb-4">Verified Participants</h3>
        <div id="participantList" class="grid grid-cols-2 gap-3">
            </div>
    </div>

    <nav class="nav-bar">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i>HOME</a>
        <a href="anggota.html" class="nav-item"><i class="fa-solid fa-users"></i>ANGGOTA</a>
        <a href="undian.html" class="nav-item active"><i class="fa-solid fa-trophy"></i>DRAW</a>
        <a href="setting.html" class="nav-item"><i class="fa-solid fa-gear"></i>SETTING</a>
    </nav>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuAkqz-1dDcBhL5iYppX25pM5sF7LX8CQ",
            authDomain: "arisan-17397.firebaseapp.com",
            projectId: "arisan-17397",
            storageBucket: "arisan-17397.firebasestorage.app",
            messagingSenderId: "12736886742",
            appId: "1:12736886742:web:b6da8d1bd74ea5ae839677"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let participants = [];
        const btnStart = document.getElementById('btnStart');
        const btnReset = document.getElementById('btnReset');
        const winnerBox = document.getElementById('winner-box');
        const statusLabel = document.getElementById('status-label');
        const timerDisplay = document.getElementById('timer-display');

        // Load Peserta yang sudah bayar dan belum menang
        async function loadParticipants() {
            const q = query(collection(db, "anggota"), where("statusBayar", "==", true), where("sudahMenang", "==", false));
            const snap = await getDocs(q);
            const listEl = document.getElementById('participantList');
            listEl.innerHTML = "";
            participants = [];

            snap.forEach(docSnap => {
                const data = docSnap.data();
                participants.push({ id: docSnap.id, nama: data.nama });
                listEl.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm text-[10px] font-bold text-slate-600 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> ${data.nama}
                    </div>`;
            });
        }
        loadParticipants();

        btnStart.onclick = async () => {
            if (participants.length === 0) return alert("Error: Tidak ada peserta terverifikasi!");
            
            if (confirm("Kirim sinyal LIVE ke semua perangkat?")) {
                try {
                    btnStart.disabled = true;
                    btnStart.style.opacity = "0.5";
                    
                    const endTime = new Date().getTime() + 61000;

                    // Mengaktifkan status undian di database
                    await setDoc(doc(db, "sistem", "status_undian"), {
                        isRunning: true,
                        endTime: endTime
                    }, { merge: true });

                    statusLabel.innerText = "BROADCASTING LIVE";
                    statusLabel.className = "status-pill bg-rose-100 text-rose-600 animate-pulse";
                    timerDisplay.classList.remove('hidden');

                    const adminTimer = setInterval(async () => {
                        const now = new Date().getTime();
                        const distance = endTime - now;
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                        
                        timerDisplay.innerText = `00:${seconds < 10 ? '0'+seconds : seconds}`;

                        if (distance < 0) {
                            clearInterval(adminTimer);
                            timerDisplay.innerText = "00:00";
                            
                            // Pilih pemenang secara acak dari list
                            const randomWinner = participants[Math.floor(Math.random() * participants.length)];
                            winnerBox.innerText = randomWinner.nama;
                            winnerBox.className = "text-3xl font-black text-indigo-600 animate-bounce";
                            
                            // Update status di Firebase
                            await updateDoc(doc(db, "anggota", randomWinner.id), { sudahMenang: true });
                            
                            btnReset.classList.remove('hidden');
                        }
                    }, 1000);

                } catch (e) {
                    alert("Error: " + e.message);
                    btnStart.disabled = false;
                }
            }
        };

        btnReset.onclick = async () => {
            if (confirm("Hentikan siaran dan reset sistem?")) {
                await updateDoc(doc(db, "sistem", "status_undian"), { isRunning: false });
                location.reload();
            }
        };
    </script>
</body>
</html>
