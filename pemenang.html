<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hall of Fame - Arisan Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --gold: #b45309; --bg: #f8fafc; }
        html, body { height: 100%; overflow-x: hidden; overflow-y: auto; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 160px; color: #334155; }

        /* Header Royal Luxe */
        .main-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
            padding: 50px 25px 80px 25px;
            border-radius: 0 0 50px 50px;
            color: white;
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.15);
        }

        /* Card Pemenang */
        .winner-card { 
            background: white; border-radius: 35px; padding: 22px; 
            margin-bottom: 18px; border: 1px solid #f1f5f9;
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            position: relative; overflow: hidden;
        }
        
        /* Efek Kilau untuk kartu pemenang */
        .winner-card::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-25deg); transition: 0.7s;
        }
        .winner-card:hover::before { left: 150%; }

        .crown-box {
            width: 55px; height: 55px; 
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #b45309; border-radius: 20px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; box-shadow: 0 8px 15px rgba(180, 83, 9, 0.1);
        }

        /* Nav Bar Luxe */
        .nav-bar {
            position: fixed; bottom: 25px; left: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            height: 75px; border-radius: 30px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12); z-index: 9999;
        }
        .nav-item { text-decoration: none; color: #94a3b8; text-align: center; font-size: 8px; font-weight: 800; }
        .nav-item.active { color: #4f46e5; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="main-header">
        <div class="flex justify-between items-center mb-5">
            <a href="dashboard.html" class="w-11 h-11 bg-white/10 rounded-2xl flex items-center justify-center text-white"><i class="fa-solid fa-chevron-left"></i></a>
            <h2 class="font-black text-lg uppercase tracking-tight">Riwayat Jackpot</h2>
            <div class="w-11"></div>
        </div>
        <div class="text-center">
            <span class="bg-white/10 px-4 py-2 rounded-full text-[10px] font-bold tracking-[2px] border border-white/10 uppercase">Hall of Fame</span>
        </div>
    </div>

    <div class="p-6 -mt-10" id="listPemenang">
        <div class="text-center py-20 bg-white rounded-[35px] shadow-xl shadow-indigo-100/20">
            <i class="fa-solid fa-crown fa-bounce text-3xl text-amber-400 mb-4"></i>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Memuat Daftar Juara...</p>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i>HOME</a>
        <a href="bayar.html" class="nav-item"><i class="fa-solid fa-wallet"></i>BAYAR</a>
        <a href="antrian.html" class="nav-item"><i class="fa-solid fa-list-ol"></i>ANTRIAN</a>
        <a href="pemenang.html" class="nav-item active"><i class="fa-solid fa-crown"></i>WINNER</a>
    </nav>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuAkqz-1dDcBhL5iYppX25pM5sF7LX8CQ",
            authDomain: "arisan-17397.firebaseapp.com",
            projectId: "arisan-17397",
            storageBucket: "arisan-17397.firebasestorage.app",
            messagingSenderId: "12736886742",
            appId: "1:12736886742:web:b6da8d1bd74ea5ae839677"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const q = query(collection(db, "anggota"), where("sudahMenang", "==", true));
        
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('listPemenang');
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 35px; border: 2px dashed #f1f5f9;">
                        <i class="fa-solid fa-trophy-slash" style="font-size: 40px; color: #e2e8f0; margin-bottom: 15px;"></i>
                        <p style="color: #94a3b8; font-weight: 800; font-size: 11px; text-transform: uppercase;">Belum ada riwayat pemenang</p>
                    </div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;

                container.innerHTML += `
                    <div class="winner-card">
                        <div class="flex items-center gap-4">
                            <div class="crown-box">
                                <i class="fa-solid fa-crown"></i>
                            </div>
                            <div>
                                <h4 class="font-black text-slate-800 text-sm uppercase tracking-tight">${data.nama}</h4>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span>
                                    <p class="text-[9px] text-amber-600 font-bold uppercase tracking-widest">Verified Winner</p>
                                </div>
                            </div>
                        </div>
                        <button onclick="hapusPemenang('${id}', '${data.nama}')" 
                                style="width: 45px; height: 45px; background: #fff1f2; color: #e11d48; border-radius: 18px; border: none; display: flex; align-items: center; justify-content: center;"
                                class="active:scale-90 transition-all">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>`;
            });
        });

        window.hapusPemenang = async (id, nama) => {
            if (confirm(`Kembalikan ${nama} ke daftar undian aktif?`)) {
                try {
                    await updateDoc(doc(db, "anggota", id), { 
                        sudahMenang: false,
                        statusBayar: false // Reset agar mereka harus lapor bayar lagi untuk periode baru
                    });
                } catch (e) {
                    alert("Gagal: " + e.message);
                }
            }
        };
    </script>
</body>
</html>
