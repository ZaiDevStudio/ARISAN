<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arisan Luxe - Eksklusif & Terpercaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #1e1b4b; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute; width: 300px; height: 300px;
            background: rgba(79, 70, 229, 0.4);
            filter: blur(80px); border-radius: 50%; z-index: -1;
        }

        .logo-container {
            width: 150px; height: 150px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 40px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 4px solid rgba(255,255,255,0.1);
        }

        .btn-entry {
            background: white; color: #1e1b4b;
            padding: 18px 40px; border-radius: 20px;
            font-weight: 800; text-transform: uppercase;
            letter-spacing: 2px; font-size: 12px;
            transition: 0.3s; text-decoration: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn-entry:active { transform: scale(0.95); }

        .loader {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="logo-container">
        <i class="fa-solid fa-crown text-6xl text-white"></i>
    </div>

    <h1 class="text-3xl font-black mb-2 tracking-tighter">ARISAN LUXE</h1>
    <p class="text-indigo-300 text-xs font-bold uppercase tracking-[4px] mb-10">Premium Experience</p>

    <div id="check-status">
        <div class="loader" id="loading"></div>
        <a href="login.html" id="btn-start" class="btn-entry">Masuk Aplikasi</a>
    </div>

    <p class="absolute bottom-10 text-[10px] text-indigo-400 font-bold uppercase tracking-widest">v3.0 Stable Version</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuAkqz-1dDcBhL5iYppX25pM5sF7LX8CQ",
            authDomain: "arisan-17397.firebaseapp.com",
            projectId: "arisan-17397",
            storageBucket: "arisan-17397.firebasestorage.app",
            messagingSenderId: "12736886742",
            appId: "1:12736886742:web:b6da8d1bd74ea5ae839677"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const btn = document.getElementById('btn-start');
        const loader = document.getElementById('loading');

        // Tampilkan loader saat mengecek status login
        btn.style.display = 'none';
        loader.style.display = 'block';

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Jika sudah login, lempar ke dashboard
                window.location.href = "dashboard.html";
            } else {
                // Jika belum login, tampilkan tombol masuk
                loader.style.display = 'none';
                btn.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
